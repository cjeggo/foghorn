services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n

  n8n-import:
    build:
      context: .
      dockerfile: Dockerfile.n8n

  zap:
    image: zaproxy/zap-stable
    hostname: zap
    container_name: zap
    networks: ['demo']
    profiles: ['fuzzing']
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true
    ports:
      - 8090:8090

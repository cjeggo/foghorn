services:
  n8n:
    build:
      context: ../security-testing-platform
      dockerfile: Dockerfile.n8n
    environment:
      # n8n >=2.x excludes Execute Command by default as a security precaution
      # (arbitrary shell exec). This platform's whole point is running dig/nmap/
      # sqlmap/recon-ng via that node, gated behind the workflow's own
      # authorization checkbox - so re-enable it here rather than at the n8n level.
      - NODES_EXCLUDE=[]
      # n8n-local's base .env only allowlists /vault and /vault-write for file
      # nodes. Recon reports write to /data/shared/recon, which needs adding
      # explicitly or every write is silently rejected as "not writable".
      - N8N_RESTRICT_FILE_ACCESS_TO=/vault;/vault-write;/data/shared

  n8n-import:
    build:
      context: ../security-testing-platform
      dockerfile: Dockerfile.n8n
    environment:
      - NODES_EXCLUDE=[]

  zap:
    image: zaproxy/zap-stable
    hostname: zap
    container_name: zap
    networks: ['demo']
    profiles: ['fuzzing']
    # ZAP restricts its API to permitted client addresses even with disablekey
    # set - without the addrs.addr.* config below it rejects every request
    # from the n8n container with "not permitted".
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - 8090:8090
